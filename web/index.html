<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Web Racing Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="app"></canvas>

  <div id="hud">
    <div class="panel left">SPD <span id="speed">0</span> km/h</div>
    <div class="panel center">GEAR <span id="gear">1</span> | RPM <span id="rpm">900</span></div>
    <div class="panel right"><span id="abs">ABS</span> · <span id="tcs">TCS</span></div>
  </div>

  <div id="help">W/S: 가속/브레이크 · A/D: 조향 · Space: 핸드브레이크 · Shift: 스포츠 · C: 카메라 · R: 리셋</div>

  <script type="module" src="main.js"></script>
</body>
</html>
